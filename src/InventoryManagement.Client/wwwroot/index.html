<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Management System</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="InventoryManagement.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <!-- Gorgeous Loading Spinner -->
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #0F172A; color: white; font-family: 'Outfit', sans-serif;">
            <div style="width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: #5C5CFF; animation: spin 1s ease-in-out infinite;"></div>
            <h3 style="margin-top: 20px; font-weight: 500; letter-spacing: 1px;">Loading Inventory System...</h3>
        </div>
        <style>
            @keyframes spin { to { transform: rotate(360deg); } }
        </style>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Webcam Interop Code -->
    <script>
        window.webcamInterop = {
            startStream: async function (videoElementId) {
                try {
                    const video = document.getElementById(videoElementId);
                    if (!video) return false;
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: "environment",
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        } 
                    });
                    video.srcObject = stream;
                    video.play();
                    window.webcamStream = stream;
                    return true;
                } catch (err) {
                    console.error("Webcam access error:", err);
                    return false;
                }
            },
            stopStream: function () {
                if (window.webcamStream) {
                    window.webcamStream.getTracks().forEach(track => track.stop());
                    window.webcamStream = null;
                }
            },
            capturePhoto: function (videoElementId, canvasElementId) {
                const video = document.getElementById(videoElementId);
                const canvas = document.getElementById(canvasElementId);
                if (!video || !canvas) return null;
                
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                return canvas.toDataURL('image/jpeg', 0.85); // 85% JPEG quality
            },
            downloadFile: function (fileName, contentType, contentBase64) {
                const link = document.createElement('a');
                link.download = fileName;
                link.href = `data:${contentType};base64,${contentBase64}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            },
            printElement: function (elementId, title) {
                const element = document.getElementById(elementId);
                if (!element) return;
                
                // Find actual table or print raw element
                const tableElement = element.querySelector('table');
                let contentHtml = tableElement ? tableElement.outerHTML : element.outerHTML;

                const printWindow = window.open('', '_blank');
                if (!printWindow) {
                    alert("Please allow popups to print reports.");
                    return;
                }

                printWindow.document.write('<!DOCTYPE html><html><head>');
                printWindow.document.write('<title>' + title + '</title>');
                printWindow.document.write('<style>');
                printWindow.document.write('body { font-family: "Segoe UI", Arial, sans-serif; background-color: white !important; color: black !important; padding: 30px; margin: 0; }');
                printWindow.document.write('h2 { color: #1e293b; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; margin-bottom: 20px; font-size: 24px; font-family: "Segoe UI", Arial, sans-serif; }');
                printWindow.document.write('table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; color: black !important; }');
                printWindow.document.write('th, td { border: 1px solid #cbd5e1 !important; padding: 10px !important; text-align: left !important; color: black !important; background: transparent !important; }');
                printWindow.document.write('th { font-weight: bold !important; background-color: #f1f5f9 !important; }');
                printWindow.document.write('tr:nth-child(even) { background-color: #f8fafc !important; }');
                printWindow.document.write('img { max-width: 60px !important; max-height: 60px !important; object-fit: cover !important; border-radius: 4px !important; display: inline-block; vertical-align: middle; }');
                printWindow.document.write('.mud-table-pager, .mud-menu, button, .mud-button-root, .mud-table-pagination, .mud-table-pager-inner { display: none !important; }');
                
                // Styles for Barcode Stock Image Report grid printout (supports 4 columns on printed A4 portrait page)
                printWindow.document.write('.image-report-grid { display: grid !important; grid-template-columns: repeat(4, minmax(0, 1fr)) !important; gap: 15px !important; margin-top: 15px !important; width: 100% !important; }');
                printWindow.document.write('.image-report-card { background: white !important; border: 1px solid #cbd5e1 !important; border-radius: 8px !important; overflow: hidden !important; display: flex !important; flex-direction: column !important; box-shadow: none !important; page-break-inside: avoid; }');
                printWindow.document.write('.image-container { position: relative !important; width: 100% !important; aspect-ratio: 4/3 !important; background: #f1f5f9 !important; overflow: hidden !important; border-bottom: 1px solid #cbd5e1 !important; }');
                printWindow.document.write('.card-img { width: 100% !important; height: 100% !important; object-fit: cover !important; }');
                printWindow.document.write('.card-img-placeholder { width: 100% !important; height: 100% !important; display: flex !important; align-items: center !important; justify-content: center !important; background: #e2e8f0 !important; color: #64748b !important; }');
                printWindow.document.write('.age-badge { position: absolute !important; top: 5px !important; right: 5px !important; padding: 2px 6px !important; border-radius: 10px !important; font-size: 9px !important; font-weight: bold !important; color: white !important; }');
                printWindow.document.write('.age-normal { background: #10b981 !important; }');
                printWindow.document.write('.age-slow { background: #ef4444 !important; }');
                printWindow.document.write('.card-details { padding: 8px !important; display: flex !important; flex-direction: column !important; flex-grow: 1 !important; font-size: 11px !important; color: black !important; }');
                printWindow.document.write('.barcode-text { font-family: monospace !important; font-weight: bold !important; font-size: 12px !important; color: #1e293b !important; }');
                printWindow.document.write('.item-name-text { font-weight: 500 !important; font-size: 11px !important; color: #475569 !important; margin-bottom: 4px !important; }');
                printWindow.document.write('.detail-row { display: flex !important; justify-content: space-between !important; margin-bottom: 1px !important; }');
                printWindow.document.write('.detail-label { color: #64748b !important; }');
                printWindow.document.write('.detail-value { color: #0f172a !important; font-weight: 600 !important; }');
                printWindow.document.write('.mud-divider { margin: 8px 0 !important; border-top: 1px solid #cbd5e1 !important; height: 0 !important; border-bottom: none !important; }');
                
                printWindow.document.write('</style>');
                printWindow.document.write('</head><body>');
                printWindow.document.write('<h2>' + title + '</h2>');
                printWindow.document.write(contentHtml);
                printWindow.document.write('</body></html>');
                printWindow.document.close();
                
                setTimeout(function() {
                    printWindow.print();
                    printWindow.close();
                }, 500);
            }
        };

        window.keyboardShortcutInterop = {
            registerCtrlS: function (dotNetHelper) {
                if (window.ctrlSHandler) {
                    window.removeEventListener('keydown', window.ctrlSHandler);
                }
                const handler = function (e) {
                    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
                        e.preventDefault();
                        dotNetHelper.invokeMethodAsync('OnCtrlS');
                    }
                };
                window.ctrlSHandler = handler;
                window.addEventListener('keydown', handler);
            },
            unregisterCtrlS: function () {
                if (window.ctrlSHandler) {
                    window.removeEventListener('keydown', window.ctrlSHandler);
                    window.ctrlSHandler = null;
                }
            }
        };
    </script>
</body>

</html>
